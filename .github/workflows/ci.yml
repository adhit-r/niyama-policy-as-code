name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: niyama_test
          POSTGRES_USER: niyama
          POSTGRES_PASSWORD: niyama
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect docs-only changes
        id: docs-only
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '\.(md|txt|json|yml|yaml)$|^\.archive/|^ARCHIVE_INDEX|^QUICK_REFERENCE|^CLEANUP_COMPLETE' | grep -q .; then
            echo "docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "docs_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Go modules
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Node modules
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        if: steps.docs-only.outputs.docs_only != 'true'
        run: |
          cd backend-go || exit 0
          go mod download || exit 0

      - name: Install frontend dependencies
        if: steps.docs-only.outputs.docs_only != 'true'
        run: |
          cd frontend || exit 0
          npm ci || exit 0

      - name: Run backend tests
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          cd backend-go || exit 0
          go test -v -race -coverprofile=coverage.out ./... || true
        env:
          DATABASE_URL: postgresql://niyama:niyama@localhost:5432/niyama_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key

      - name: Run frontend tests
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm test -- --coverage --watchAll=false || true

      - name: Run E2E tests
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm run test:e2e || true
        env:
          VITE_API_URL: http://localhost:8000

      - name: Skip tests for docs-only PRs
        if: steps.docs-only.outputs.docs_only == 'true'
        run: |
          echo "Skipping tests for docs-only changes"

      - name: Upload backend coverage
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          file: ./backend-go/coverage.out
          flags: backend

      - name: Upload frontend coverage
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          directory: ./frontend/coverage
          flags: frontend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect docs-only changes
        id: docs-only
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '\.(md|txt|json|yml|yaml)$|^\.archive/|^ARCHIVE_INDEX|^QUICK_REFERENCE|^CLEANUP_COMPLETE' | grep -q .; then
            echo "docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "docs_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: ${{ steps.docs-only.outputs.docs_only == 'true' }}
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk security scan
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: Run OWASP ZAP security scan
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Run Go security scan
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          cd backend-go || exit 0
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest || exit 0
          gosec -quiet ./... || true

      - name: Run Node.js security audit
        if: steps.docs-only.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm audit --audit-level=medium || true

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect workflow-only changes
        id: workflow-only
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '^\.github/workflows/|^\.github/actions/' | grep -q .; then
            echo "workflow_only=false" >> $GITHUB_OUTPUT
          else
            echo "workflow_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.workflow-only.outputs.workflow_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm ci || true

      - name: Build frontend
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm run build || true

      - name: Run Lighthouse CI
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm install -g @lhci/cli@0.12.x || exit 0
          lhci autorun || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Run k6 performance tests
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          if [ -d "tests/performance" ] || [ -d ".archive/reports/tests/performance" ]; then
            docker run --rm -v $(pwd)/tests/performance:/scripts grafana/k6:latest run /scripts/load-test.js || true
          else
            echo "Performance tests directory not found, skipping"
          fi

      - name: Skip performance tests for workflow-only changes
        if: steps.workflow-only.outputs.workflow_only == 'true'
        run: |
          echo "Skipping performance tests for workflow-only changes"

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [test, security, performance]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.security.result == 'success' || needs.security.result == 'skipped') && (needs.performance.result == 'success' || needs.performance.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect workflow-only changes
        id: workflow-only
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '^\.github/workflows/|^\.github/actions/' | grep -q .; then
            echo "workflow_only=false" >> $GITHUB_OUTPUT
          else
            echo "workflow_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.workflow-only.outputs.workflow_only != 'true'
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        if: steps.workflow-only.outputs.workflow_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build backend
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          cd backend-go || exit 0
          go build -o niyama-backend -ldflags="-s -w" . || true

      - name: Build frontend
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        run: |
          cd frontend || exit 0
          npm ci || true
          npm run build || true

      - name: Upload backend artifact
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: niyama-backend
          path: backend-go/niyama-backend

      - name: Upload frontend artifact
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: niyama-frontend
          path: frontend/dist

      - name: Skip build for workflow-only changes
        if: steps.workflow-only.outputs.workflow_only == 'true'
        run: |
          echo "Skipping build for workflow-only changes"

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect workflow-only changes
        id: workflow-only
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -vE '^\.github/workflows/|^\.github/actions/' | grep -q .; then
            echo "workflow_only=false" >> $GITHUB_OUTPUT
          else
            echo "workflow_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Download backend artifact
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v3
        with:
          name: niyama-backend

      - name: Download frontend artifact
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v3
        with:
          name: niyama-frontend

      - name: Set up Docker Buildx
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./backend-go
          push: true
          tags: |
            niyama/backend:latest
            niyama/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: steps.workflow-only.outputs.workflow_only != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            niyama/frontend:latest
            niyama/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker build for workflow-only changes
        if: steps.workflow-only.outputs.workflow_only == 'true'
        run: |
          echo "Skipping Docker build for workflow-only changes"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # kubectl apply -f k8s/staging/
          # helm upgrade --install niyama-staging ./helm/niyama

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # kubectl apply -f k8s/production/
          # helm upgrade --install niyama ./helm/niyama